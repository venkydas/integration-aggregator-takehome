image:
  repository: ghcr.io/venkydas/aggregator
  # Defaults to the chart's appVersion.
  tag: ""
  pullPolicy: IfNotPresent

# Base URL that users' browsers can reach; providers redirect to <publicUrl>/callback.
publicUrl: http://localhost:8080

bao:
  addr: http://openbao.openbao.svc:8200
  mount: oauth2
  # Kubernetes auth: the pod logs in with its service-account token, so no
  # OpenBao credential is ever stored in the cluster for this service.
  authMount: kubernetes
  role: aggregator

workers: 8
queueSize: 1000

serviceAccount:
  # Must match the OpenBao role binding created by scripts/bootstrap-bao.sh.
  name: aggregator

service:
  type: ClusterIP
  port: 8080

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    memory: 256Mi
