# Local OIDC provider for the end-to-end test (navikt/mock-oauth2-server).
# Logins are approved without a form, so a script can complete the OAuth flow.
# Test infrastructure only; never deployed alongside real providers in prod.
apiVersion: v1
kind: Namespace
metadata:
  name: mock-oauth2
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mock-oauth2
  namespace: mock-oauth2
  labels:
    app.kubernetes.io/name: mock-oauth2
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mock-oauth2
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mock-oauth2
    spec:
      containers:
        - name: mock-oauth2
          image: ghcr.io/navikt/mock-oauth2-server:6.0.4
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: SERVER_PORT
              value: "8080"
            - name: JSON_CONFIG
              value: '{"interactiveLogin": false}'
          readinessProbe:
            httpGet:
              path: /default/.well-known/openid-configuration
              port: http
            periodSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 192Mi
            limits:
              memory: 384Mi
---
apiVersion: v1
kind: Service
metadata:
  name: mock-oauth2
  namespace: mock-oauth2
spec:
  selector:
    app.kubernetes.io/name: mock-oauth2
  ports:
    - name: http
      port: 8080
      targetPort: http
